name: EduConnect Backend CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Construir imagen Docker del backend
        run: docker build --tag educonnect-backend:${{ github.sha }} ./backend

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas unitarias
        working-directory: backend
        run: npm test

  deploy:
    name: Deploy
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar variables de entorno
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          cp .env.example .env
          echo "" >> .env
          # Si existen GitHub Secrets, reemplazan los valores de ejemplo
          [ -n "$JWT_SECRET" ] && sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" .env
          [ -n "$SMTP_USER" ]  && sed -i "s|^SMTP_USER=.*|SMTP_USER=$SMTP_USER|" .env
          [ -n "$SMTP_PASS" ]  && sed -i "s|^SMTP_PASS=.*|SMTP_PASS=$SMTP_PASS|" .env
          echo "Archivo .env preparado"

      - name: Desplegar contenedores en el runner (MySQL + backend)
        run: docker compose up -d --build db backend

      - name: Verificar disponibilidad del backend
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:5000/api/health; then
              echo ""
              echo "Backend desplegado y disponible en el runner"
              exit 0
            fi
            echo "Esperando al backend ($i/36)..."
            sleep 5
          done
          echo "El backend no respondió a tiempo"
          docker compose logs db backend
          exit 1

      - name: Estado de los contenedores
        if: always()
        run: docker compose ps
