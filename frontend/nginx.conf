server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint de healthcheck para el contenedor del frontend
    location /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"EduConnect Frontend"}';
    }

    # Soporte para rutas client-side de React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para archivos estáticos compilados
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}